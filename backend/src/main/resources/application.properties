server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/instituto_site}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:app}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:4321,http://127.0.0.1:4321}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:4321}
app.api-base-url=${APP_API_BASE_URL:http://localhost:8080}
app.trust-proxy-headers=${APP_TRUST_PROXY_HEADERS:false}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie-samesite=${APP_AUTH_COOKIE_SAMESITE:Lax}
app.auth.login.max-attempts=${APP_AUTH_LOGIN_MAX_ATTEMPTS:10}
app.auth.login.window-seconds=${APP_AUTH_LOGIN_WINDOW_SECONDS:900}
app.auth.login.block-seconds=${APP_AUTH_LOGIN_BLOCK_SECONDS:900}
app.email-verification.ttl-hours=${APP_EMAIL_VERIFICATION_TTL_HOURS:24}
app.email.disposable.update-enabled=${APP_EMAIL_DISPOSABLE_UPDATE_ENABLED:true}
app.email.disposable.initial-delay-ms=${APP_EMAIL_DISPOSABLE_INITIAL_DELAY_MS:300000}
app.email.disposable.refresh-ms=${APP_EMAIL_DISPOSABLE_REFRESH_MS:86400000}
app.email.disposable.sources=${APP_EMAIL_DISPOSABLE_SOURCES:https://raw.githubusercontent.com/disposable/disposable-email-domains/master/domains.txt,https://raw.githubusercontent.com/7c/fakefilter/main/txt/data.txt}
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:${EMAIL_SENDER:no-reply@instituto.local}}
app.security.hsts-enabled=${APP_SECURITY_HSTS_ENABLED:false}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:${EMAIL_SENDER:}}
spring.mail.password=${SMTP_PASS:${EMAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=60000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.test-connection=${SMTP_TEST_CONNECTION:false}

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
