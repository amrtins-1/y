name: Atualiza Cotacoes

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-cotacoes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run quotes scraper
        run: python scripts/atualiza_precos.py

      - name: Commit updated quote files
        run: |
          if git diff --quiet -- src/data/cotacoes.js src/data/historico.json; then
            echo "Sem alteracoes nas cotacoes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cotacoes.js src/data/historico.json
          git commit -m "chore: atualiza cotacoes"
          git push
